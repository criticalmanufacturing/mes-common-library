parameters:
  CmfAuditVersion: '<%= $CLI_PARAM_CmfAuditVersion %>'
  CmfAuditRegistry: '<%= $CLI_PARAM_CmfAuditRegistry %>'

steps:
# Requires a cmf-cli login beforehand (cmf-login.yml), so that ~/.npmrc gets the CollabHub registry credentials
- script: npm install @criticalmanufacturing/audit@${{ parameters.CmfAuditVersion }} -g --@criticalmanufacturing:registry=${{ parameters.CmfAuditRegistry }}
  displayName: Install cmf-audit@${{ parameters.CmfAuditVersion }}
