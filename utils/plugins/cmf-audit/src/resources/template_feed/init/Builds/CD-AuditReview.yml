# CM DS Audit Review Pipeline
# Installs the Cmf.Audit package into the environment and runs the audit against it
pool:
  name: <%= $CLI_PARAM_AgentPool %>

# Manual trigger only
trigger: none
pr: none

resources:
  containers:
  - container: build-runner
    image: $(BuildRunner)
//#if (defaultServiceConnection != "")
    endpoint: <%= $CLI_PARAM_DefaultServiceConnection %>
//#endif
    options: <%= $CLI_PARAM_ContainerOptions %>

variables:
- group: Authentication Variables
- template: .vars/global.yml # Template reference to global variables
//#if (hasEnvironments == "true")
- template: .vars/${{ parameters.Environment }}.yml # Template reference to environment related variables
//#endif
- name: System.Debug
  value: $[or(eq(variables['Agent.Diagnostic'], true), eq(variables['DebugMode'], true))]

parameters:
//#if (hasEnvironments == "true")
- name: Environment
  displayName: Environment name
  type: string
  default: <%= $CLI_PARAM_DefaultEnvironment %>
  values:
<%= $CLI_PARAM_EnvironmentValues %>
//#endif

name: AuditReview-$(Build.BuildId)
stages:
- stage: AuditReview
  displayName: Audit Review
  jobs:
  - job: AuditReview
    displayName: Audit Review
    container: build-runner
    workspace:
      clean: all
    steps:
    # Audit reads the project's own sources (.project-config.json, cmfpackage.json, etc...)
    - checkout: self

    # Read Release Manifest
    - template: .tasks/read-release-manifest.yml
      parameters:
        Environment: ${{ parameters.Environment }}
        CustomerPortalPAT: $(CustomerPortalPAT)

    # Login with CP token
    - template: .tasks/cmf-login.yml
      parameters:
        CustomerPortalPAT: $(CustomerPortalPAT)

    # Assembling Audit Package
    - template: .tasks/assembling-audit-package.yml

    # Audit Package Installation
    - template: .tasks/portal-deploy.yml
      parameters:
        PackageToInstall: '$(CmfAuditPackageToInstall)'
        displayName: Audit Package Installation
        CustomerPortalPAT: $(CustomerPortalPAT)

    # Install cmf-audit, generate PAT and run the Audit Review
    - template: .tasks/audit-review.yml
