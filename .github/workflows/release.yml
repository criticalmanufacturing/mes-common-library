name: Release

on:
  workflow_dispatch:
    inputs:
      feature:
        description: 'Feature folder under features/ to release (or "all")'
        required: true
        default: 'all'
        type: string
      mes-version:
        description: 'MES version to tag against (default: each feature''s own Cmf.Environment dependency version)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
    - uses: actions/checkout@v4
    - name: List feature directories to build/release
      id: list
      shell: bash
      run: |
        if [ "${{ inputs.feature }}" != "all" ]; then
          FEATURES=$(printf '%s\n' "${{ inputs.feature }}" | jq -R -s -c 'split("\n")[:-1]')
        else
          FEATURES=$(ls -d features/*/ | xargs -n1 basename | jq -R -s -c 'split("\n")[:-1]')
        fi
        echo "Features to process: $FEATURES"
        echo "features=$FEATURES" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    strategy:
      matrix:
        feature: ${{ fromJson(needs.discover.outputs.features) }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup npm config
      shell: bash
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.CM_IO_BASIC_TOKEN }}
      run: |
          npm config set registry="https://criticalmanufacturing.io/repository/npm/"
          npm config set //criticalmanufacturing.io/repository/npm/:_auth=$NUGET_AUTH_TOKEN
          npm config ls
    - name: Create NuGet.config file
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>' > NuGet.config
        echo '<configuration>' >> NuGet.config
        echo '  <packageSources>' >> NuGet.config
        echo '  </packageSources>' >> NuGet.config
        echo '</configuration>' >> NuGet.config
    - name: Add NuGet source with credentials
      run: |
          dotnet nuget add source https://criticalmanufacturing.io/repository/nuget/index.json \
          --name CMFeed \
          --username ${{ secrets.NUGET_USERNAME }} \
          --password ${{ secrets.NUGET_PASSWORD }} \
          --store-password-in-clear-text \
          --configfile NuGet.config
    - name: Install @cmf/cli
      run: npm install -g @criticalmanufacturing/cli
    - name: Run cli build and compile for ${{ matrix.feature }}
      shell: pwsh
      run: |

          # Go to repository root directory
           $CI_DIR = "$env:GITHUB_WORKSPACE/CI-DIR"
          New-Item -ItemType Directory -Force -Path $CI_DIR

          # Build every package under this feature (its own root package plus every nested package)
          $featureRoot = "$env:GITHUB_WORKSPACE/features/${{ matrix.feature }}"
          $directories = @(Get-Item -Path $featureRoot) + (Get-ChildItem -Path $featureRoot -Recurse -Directory | Where-Object { Test-Path "$($_.FullName)/cmfpackage.json" })

          # Iterate through each directory and execute the cmf build --test command
          foreach ($directory in $directories) {
              Write-Host "Building package in directory: $($directory.FullName)"

              try {
                  Push-Location -Path $directory.FullName -ErrorAction Stop
              }
              catch {
                  Write-Error "Failed to change directory to $($directory.FullName): $_"
                  exit 1
              }

              # Execute the restore, build and pack commands
              cmf restore
              cmf build --test
              cmf pack -o $CI_DIR

              # if ($LASTEXITCODE -ne 0) {
              #     Write-Error "cmf build --test failed in $($directory.FullName)"
              #     exit 1
              # }

              # Go back to the previous directory
              Pop-Location
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to return to the previous directory from $($directory.FullName)"
                  exit 1
              }
          }
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.feature }}-packages
        path: ${{ github.workspace }}/CI-DIR/*.zip
        compression-level: 9

  release:
    needs: [discover, build]
    strategy:
      matrix:
        feature: ${{ fromJson(needs.discover.outputs.features) }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Read feature version
      id: version
      shell: bash
      run: |
        VERSION=$(jq -r '.version' "features/${{ matrix.feature }}/cmfpackage.json")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Resolve MES version
      id: mes
      shell: bash
      run: |
        MES_VERSION="${{ inputs.mes-version }}"
        if [ -z "$MES_VERSION" ]; then
          MES_VERSION=$(jq -r '.dependencies[] | select(.id == "Cmf.Environment") | .version' "features/${{ matrix.feature }}/cmfpackage.json")
        fi
        if [ -z "$MES_VERSION" ] || [ "$MES_VERSION" = "null" ]; then
          echo "::error::Could not resolve MES version for feature ${{ matrix.feature }}: no mes-version input and no Cmf.Environment dependency found"
          exit 1
        fi
        echo "version=$MES_VERSION" >> "$GITHUB_OUTPUT"
    - name: Compute release tag
      id: tag
      shell: bash
      run: |
        MES_TAG=$(echo "${{ steps.mes.outputs.version }}" | tr '.' '_')
        PKG_TAG=$(echo "${{ steps.version.outputs.version }}" | tr '.' '_')
        echo "tag=${{ matrix.feature }}/${MES_TAG}-v${PKG_TAG}" >> "$GITHUB_OUTPUT"
    - name: Download feature artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.feature }}-packages
        path: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "${{ matrix.feature }} ${{ steps.version.outputs.version }} (MES ${{ steps.mes.outputs.version }})"
        files: dist/*.zip
