name: Build changed packages

# Reusable workflow shared by pr.yml and ci.yml: builds+packs only the
# cmfpackage.json directories affected by the diff between base-sha and head-sha.
on:
  workflow_call:
    inputs:
      base-sha:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      run-restore:
        description: 'Whether to run cmf restore'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Whether to run cmf build --test'
        required: false
        type: boolean
        default: true
      run-pack:
        description: 'Whether to run cmf pack after build (skip for PR validation)'
        required: false
        type: boolean
        default: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find changed cmfpackage.json directories
      id: list
      shell: bash
      run: |
        BASE_SHA="${{ inputs.base-sha }}"
        HEAD_SHA="${{ inputs.head-sha }}"
        ZERO_SHA="0000000000000000000000000000000000000000"

        # First push of a new branch: "before" is the zero SHA, so diff against
        # where this branch forked from main instead.
        if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
          git fetch origin main
          BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
        fi

        CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
        echo "Changed files:"
        echo "$CHANGED_FILES"

        # All package directories, deepest first, so a change in a nested
        # package (e.g. Foo/Foo.IoT) doesn't also mark its parent (Foo) as changed.
        mapfile -t PKG_DIRS < <(find . -name cmfpackage.json -exec dirname {} \; | sed 's|^\./||' | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)

        declare -A CHANGED_PKGS
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          for dir in "${PKG_DIRS[@]}"; do
            case "$file" in
              "$dir"/*|"$dir")
                CHANGED_PKGS["$dir"]=1
                break
                ;;
            esac
          done
        done <<< "$CHANGED_FILES"

        if [ ${#CHANGED_PKGS[@]} -eq 0 ]; then
          PACKAGES="[]"
        else
          PACKAGES=$(printf '%s\n' "${!CHANGED_PKGS[@]}" | jq -R -s -c 'split("\n")[:-1]')
        fi

        echo "Changed packages: $PACKAGES"
        echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup npm config
      shell: bash
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.CM_IO_BASIC_TOKEN }}
      run: |
          npm config set registry="https://criticalmanufacturing.io/repository/npm/"
          npm config set //criticalmanufacturing.io/repository/npm/:_auth=$NUGET_AUTH_TOKEN
          npm config ls
    - name: Create NuGet.config file
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>' > NuGet.config
        echo '<configuration>' >> NuGet.config
        echo '  <packageSources>' >> NuGet.config
        echo '  </packageSources>' >> NuGet.config
        echo '</configuration>' >> NuGet.config
    - name: Add NuGet source with credentials
      run: |
          dotnet nuget add source https://criticalmanufacturing.io/repository/nuget/index.json \
          --name CMFeed \
          --username ${{ secrets.NUGET_USERNAME }} \
          --password ${{ secrets.NUGET_PASSWORD }} \
          --store-password-in-clear-text \
          --configfile NuGet.config
    - name: Install @cmf/cli
      run: npm install -g @criticalmanufacturing/cli
    - name: Build and pack ${{ matrix.package }}
      shell: pwsh
      env:
        RUN_BUILD: ${{ inputs.run-build }}
        RUN_RESTORE: ${{ inputs.run-restore }}
        RUN_PACK: ${{ inputs.run-pack }}
      run: |
          $CI_DIR = "$env:GITHUB_WORKSPACE/CI-DIR"
          New-Item -ItemType Directory -Force -Path $CI_DIR

          Push-Location -Path "$env:GITHUB_WORKSPACE/${{ matrix.package }}" -ErrorAction Stop
          
          
          if ($env:RUN_RESTORE -eq "true") {
            cmf restore
          }
          if ($env:RUN_BUILD -eq "true") {
            cmf build --test
          }
          if ($env:RUN_PACK -eq "true") {
            cmf pack -o $CI_DIR
          }
          Pop-Location
