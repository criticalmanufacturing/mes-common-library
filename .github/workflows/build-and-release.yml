name: MES Common Library Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ "*/dev", "*/dev/*", "*/fix/*" ]
  pull_request:
    branches: [ "main*", "*/dev", "*/dev/*" ]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest]
        version: [11.1.4]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup npm config
      shell: bash
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.CM_IO_BASIC_TOKEN }}
      run: |
          npm config set registry="https://criticalmanufacturing.io/repository/npm/"
          npm config set //criticalmanufacturing.io/repository/npm/:_auth=$NUGET_AUTH_TOKEN
          npm config ls
    - name: Create NuGet.config file
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>' > NuGet.config
        echo '<configuration>' >> NuGet.config
        echo '  <packageSources>' >> NuGet.config
        echo '  </packageSources>' >> NuGet.config
        echo '</configuration>' >> NuGet.config
    - name: Add NuGet source with credentials
      run: |
          dotnet nuget add source https://criticalmanufacturing.io/repository/nuget/index.json \
          --name CMFeed \
          --username ${{ secrets.NUGET_USERNAME }} \
          --password ${{ secrets.NUGET_PASSWORD }} \
          --store-password-in-clear-text \
          --configfile NuGet.config
    - name: Install @cmf/cli
      run: npm install -g @criticalmanufacturing/cli
    - name: Run cli build and compile
      shell: pwsh
      run: |

          # Go to repository root directory
           $CI_DIR = "$env:GITHUB_WORKSPACE/CI-DIR"
          New-Item -ItemType Directory -Force -Path $CI_DIR
          
          # Get all directories containing a cmfpackage.json file
          $directories = Get-ChildItem -Recurse -Directory | Where-Object { Test-Path "$($_.FullName)/cmfpackage.json" }

          # Iterate through each directory and execute the cmf build --test command
          foreach ($directory in $directories) {
              Write-Host "Building package in directory: $($directory.FullName)"

              try {
                  Push-Location -Path $directory.FullName -ErrorAction Stop
              }
              catch {
                  Write-Error "Failed to change directory to $($directory.FullName): $_"
                  exit 1
              }

              # Execute the restore, build and pack commands
              cmf restore
              cmf build --test
              cmf pack -o $CI_DIR

              # if ($LASTEXITCODE -ne 0) {
              #     Write-Error "cmf build --test failed in $($directory.FullName)"
              #     exit 1
              # }
              
              # Go back to the previous directory
              Pop-Location
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to return to the previous directory from $($directory.FullName)"
                  exit 1
              }
          }        
    - uses: actions/upload-artifact@v4
      with:
        name: mes-common-library-packages-${{ matrix.version }}.zip
        path: ${{ github.workspace }}/CI-DIR/*.zip
        compression-level: 9
